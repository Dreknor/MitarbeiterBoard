        schueler_id: { type: integer, nullable: true }
        grading_system: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        created_by_id: { type: integer }
        created_by_name: { type: string }
        is_owner: { type: boolean }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        is_completed: { type: boolean }
        questions:
          type: array
          items: { type: object, properties: { id: { type: integer }, question: { type: string }, sort_order: { type: integer } } }
        answers:
          type: array
          items:
            type: object
            properties:
              schueler_id: { type: integer }
              question_id: { type: integer }
              rating_value: { type: integer, nullable: true, description: Pädagogenbewertung 1–5 }
              self_rating: { type: integer, nullable: true, description: Selbsteinschätzung 1–5 }
              comment: { type: string, nullable: true }
              assessed_at: { type: string, format: date-time, nullable: true }
        teacher_assessments:
          type: array
          items: { type: object, properties: { schueler_id: { type: integer }, note: { type: string }, noted_at: { type: string, format: date-time } } }
    GradingSessionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/GradingSession' }
        meta: { type: object }
    GradingAssessmentCreate:
      type: object
      properties:
        schueler_id: { type: integer, description: "Pflicht bei Gruppen-Sessions" }
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id: { type: integer, example: 15 }
              rating_value: { type: integer, minimum: 1, maximum: 5, nullable: true, example: 4 }
              self_rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
              comment: { type: string, nullable: true }
        teacher_assessment: { type: string, nullable: true, example: Die Kriterien für Graduierung II sind vollumfänglich erfüllt. }
        finalize: { type: boolean, default: false }
        grading_stage_id: { type: integer, nullable: true, description: "Nur mit finalize=true; null entfernt die Stufe" }
    DiagnosticArea:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        sort_order: { type: integer }
        stages:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              code: { type: string }
              goal_description: { type: string, nullable: true }
              sort_order: { type: integer }
              criteria:
                type: array
                items: { type: object, properties: { id: { type: integer }, code: { type: string }, description: { type: string }, sort_order: { type: integer } } }
    DevelopmentGoal:
      type: object
      properties:
        id: { type: integer }
        schueler_id: { type: integer }
        diagnostic_session_id: { type: integer, nullable: true }
        area_id: { type: integer, nullable: true }
        area_title: { type: string, nullable: true }
        stage_id: { type: integer, nullable: true }
        criterion_id: { type: integer, nullable: true }
        title: { type: string }
        target_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, in_progress, achieved, not_achieved, archived] }
        is_active: { type: boolean }
        completion_notes: { type: string, nullable: true }
        completed_at: { type: string, format: date, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CurrentCriterionGoal:
      type: object
      description: Im Web als "aktuelles Ziel" markiertes Katalogkriterium
      properties:
        assessment_id: { type: integer }
        criterion_id: { type: integer }
        code: { type: string }
        description: { type: string }
        stage_title: { type: string }
        area_id: { type: integer }
        area_title: { type: string }
        rating: { type: string, nullable: true, enum: [white, gray, dark_gray] }
        session_id: { type: integer }
        session_date: { type: string, format: date }
    DiagnosticSession:
      type: object
      properties:
        id: { type: integer }
        schueler_id: { type: integer }
        area_id: { type: integer }
        area_title: { type: string }
        session_date: { type: string, format: date }
        is_completed: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        created_by_name: { type: string, nullable: true }
        stage_notes: { type: array, items: { type: object, properties: { stage_id: { type: integer }, stage_title: { type: string }, notes: { type: string } } } }
        assessments: { type: array, items: { type: object, properties: { criterion_id: { type: integer }, rating: { type: string, nullable: true }, is_current_goal: { type: boolean } } } }
        rating_summary: { type: object, properties: { white: { type: integer }, gray: { type: integer }, dark_gray: { type: integer }, total: { type: integer } } }
        development_goals: { type: array, items: { $ref: '#/components/schemas/DevelopmentGoal' } }
    DiagnosticSessionCreate:
      type: object
      required: [schueler_id, area_id]
      properties:
        schueler_id: { type: integer, example: 42 }
        area_id: { type: integer, example: 1 }
        stage_id: { type: integer, nullable: true, example: 11, description: Muss zum Bereich gehören }
        session_date: { type: string, format: date, description: "Standard: heute (nur bei neuer Sitzung)" }
        assessment_notes: { type: string, nullable: true, description: "Mit stage_id als Stufen-Notiz, sonst als Sitzungsnotiz" }
        complete: { type: boolean, default: true }
        assessments:
          type: array
          description: Ampelbewertung von Katalogkriterien (optional)
          items:
            type: object
            required: [criterion_id]
            properties:
              criterion_id: { type: integer }
              rating: { type: string, nullable: true, enum: [white, gray, dark_gray] }
              is_current_goal: { type: boolean }
        goals:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string, maxLength: 500, example: Sachtexte mit Nebensätzen sinnentnehmend lesen }
              target_date: { type: string, format: date, nullable: true, example: '2026-11-30' }
              criterion_id: { type: integer, nullable: true, description: Optionaler Bezug auf ein Katalogkriterium }
    Dossier:
      type: object
      properties:
        student: { type: object }
        period: { type: object, properties: { from_date: { type: string, format: date }, to_date: { type: string, format: date } } }
        paed_diary:
          type: object
          properties:
            entries_count: { type: integer }
            by_category:
              type: array
              items: { type: object, properties: { category_id: { type: integer, nullable: true }, category_name: { type: string }, category_color: { type: string, nullable: true }, count: { type: integer } } }
            entries: { type: array, items: { $ref: '#/components/schemas/DiaryEntry' } }
            goals: { type: array, items: { type: object }, description: "Ziele „an denen ich arbeiten möchte“ aus dem Tagebuch" }
        grading:
          type: object
          properties:
            current_stage: { $ref: '#/components/schemas/CurrentStage' }
            stage_history: { type: array, items: { $ref: '#/components/schemas/StageHistoryItem' } }
            completed_sessions: { type: array, items: { $ref: '#/components/schemas/GradingSession' } }
        diagnostic:
          type: object
          nullable: true
          properties:
            sessions: { type: array, items: { $ref: '#/components/schemas/DiagnosticSession' } }
            development_goals: { type: array, items: { $ref: '#/components/schemas/DevelopmentGoal' } }
            current_criterion_goals: { type: array, items: { $ref: '#/components/schemas/CurrentCriterionGoal' } }
        meta:
          type: object
          properties:
            generated_at: { type: string, format: date-time }
            generated_by: { type: string }
            includes_confidential: { type: boolean }
            includes_diagnostics: { type: boolean }
