        stage_id: { type: integer, nullable: true }
        stage_title: { type: string, nullable: true }
        stage_badge_url: { type: string, nullable: true }
        previous_stage_id: { type: integer, nullable: true }
        previous_stage_title: { type: string, nullable: true }
        changed_by_name: { type: string, nullable: true }
        paed_diary_entry_id: { type: integer, nullable: true }
    GradingSession:
      type: object
      properties:
        id: { type: integer }
